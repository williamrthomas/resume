name = "fde-williamrthomas"
compatibility_date = "2024-11-12"
pages_build_output_dir = "./dist"

# Secrets to set on Cloudflare Pages (NOT committed):
#   wrangler pages secret put SITE_PASSWORD --project-name=fde-williamrthomas
#   wrangler pages secret put ANTHROPIC_API_KEY --project-name=fde-williamrthomas
#   wrangler pages secret put SESSION_SECRET --project-name=fde-williamrthomas
#   wrangler pages secret put ADMIN_KEY --project-name=fde-williamrthomas   # gates /api/admin/logs

# Or set them via the Cloudflare dashboard:
# Pages -> fde-williamrthomas -> Settings -> Environment variables -> Production

# D1 database for visitor + chat logging (schema in ./schema.sql).
# NOTE: if you deploy via the Pages <-> Git dashboard integration rather than
# `wrangler pages deploy`, also add this binding under
# Pages -> Settings -> Functions -> D1 database bindings (binding name: LOGS_DB).
[[d1_databases]]
binding = "LOGS_DB"
database_name = "fde-williamrthomas-logs"
database_id = "43ea4b12-9f9e-4122-b91e-3e2437eb8ac2"
